[package]
name = "runbridge"
version = "0.2.1"
edition = "2021"
description = "A Rust library for running serverless functions on AWS Lambda and Google Cloud Run"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[[bin]]
name = "runbridge-cgi"
path = "src/cgi_main.rs"
required-features = ["cgi"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_html_form = "0.2"
log = "0.4"
env_logger = "0.11"
bytes = "1"
async-trait = "0.1"
thiserror = "2"
regex = "1"
base64 = "0.22"
mime_guess = "2"

# Lambda関連の依存関係
lambda_runtime = { version = "1", optional = true }
aws_lambda_events = { version = "0.17", optional = true }

# Cloud Run関連の依存関係
actix-web = { version = "4", optional = true }
actix-rt = { version = "2", optional = true }

# CGI関連の依存関係
cgi = { version = "0.6", optional = true }
temp-env = { version = "0.3", optional = true }

chrono = { version = "0.4", features = ["clock", "std"], default-features = false }
flate2 = "1"

[features]
default = []
lambda = ["lambda_runtime", "aws_lambda_events"]
cloud_run = ["actix-web", "actix-rt"]
cgi = ["dep:cgi", "dep:temp-env"]
## テストで --all-features を使う際に排他チェックを無効化するための緩和用feature
## 本番ビルドでは有効化しないこと（デフォルト無効）
allow_feature_conflicts = []

[dev-dependencies]
mockall = "0.13"
reqwest = { version = "0.12", features = ["json"] }
httpmock = "0.8"
temp-env = "0.3"
